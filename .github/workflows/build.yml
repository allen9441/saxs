name: Build Executables

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Recreate Nightly Release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: "allen9441/saxs-releases"
          TAG_NAME: "nightly"
        run: |
          gh release delete "$TAG_NAME" --repo "$PUBLIC_REPO" --cleanup-tag -y || true
          gh release create "$TAG_NAME" \
            --repo "$PUBLIC_REPO" \
            --title "Nightly Build $(date +'%Y-%m-%d')" \
            --notes "Automated build from private repository." \
            --prerelease

  build_and_upload:
    needs: prepare_release
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: saxs_app-linux
            build_path: dist/saxs_app
          - os: windows-latest
            asset_name: saxs_app.exe
            build_path: dist/saxs_app.exe

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compile C++ Extension
      run: |
        python setup.py build_ext --inplace

    - name: Build with PyInstaller
      run: |
        pyinstaller saxs_app.spec

    - name: Rename Asset
      shell: bash
      run: mv ${{ matrix.build_path }} ${{ matrix.asset_name }}

    - name: Upload to Public Release
      if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        PUBLIC_REPO: "allen9441/saxs-releases"
        TAG_NAME: "nightly"
      run: |
        gh release upload "$TAG_NAME" "${{ matrix.asset_name }}" --repo "$PUBLIC_REPO" --clobber
