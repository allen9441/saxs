name: Build Executables

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 允許手動觸發

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compile C++ Extension
      run: |
        python setup.py build_ext --inplace

    - name: Build with PyInstaller
      run: |
        pyinstaller saxs_app.spec

    - name: Upload Linux Artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: saxs_app-linux
        path: dist/saxs_app

    - name: Upload Windows Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: saxs_app-windows
        path: dist/saxs_app.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: saxs_app-linux
          path: artifacts/linux

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: saxs_app-windows
          path: artifacts/windows

      - name: Rename artifacts
        run: |
          mkdir -p release_assets
          mv artifacts/linux/saxs_app release_assets/saxs_app-linux
          mv artifacts/windows/saxs_app.exe release_assets/saxs_app.exe
          ls -R release_assets

      - name: Publish to Public Repository
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: "allen9441/saxs-releases" 
          TAG_NAME: "nightly-cpp"
        run: |
          # Delete existing tag/release if it exists to keep it "rolling"
          gh release delete $TAG_NAME --repo $PUBLIC_REPO --cleanup-tag -y || true
          
          # Create new release
          gh release create $TAG_NAME \
            --repo $PUBLIC_REPO \
            --title "Nightly Build $(date +'%Y-%m-%d')" \
            --notes "Automated build from private repository." \
            --prerelease \
            release_assets/*
